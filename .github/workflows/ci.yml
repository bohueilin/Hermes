name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11
    # The numerical pins were recorded on Apple-silicon macOS and differ in low-order bits
    # on Linux x86-64; only same-host reproduction is claimed, so CI runs on that platform.
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-21

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      # setup-python has no macOS build of 3.11 after 3.11.9, whose ipaddress predates the
      # IPv4-mapped loopback fix; run the reference interpreter, CPython 3.11.15, instead.
      - name: Install CPython 3.11.15 with uv
        run: |
          python -m pip install "uv==0.12.24"
          uv python install --python-preference only-managed 3.11.15
          uv venv --seed --python-preference only-managed --python 3.11.15 "$RUNNER_TEMP/python-3.11.15"
          "$RUNNER_TEMP/python-3.11.15/bin/python" -c "import sys; assert sys.version_info[:3] == (3, 11, 15), sys.version"
          echo "$RUNNER_TEMP/python-3.11.15/bin" >> "$GITHUB_PATH"

      - name: Install Hermes and development dependencies
        run: python -m pip install -e ".[dev,workbench]"

      - name: Lint
        run: python -m ruff check .

      - name: Test without real MetaDrive
        run: python -m pytest -q -m "not metadrive"

  fleetlab-node:
    name: FleetLab Node 22.23.4
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-21

      - name: Set up Python for the City suite
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Hermes and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0, verified 2026-10-25
        with:
          node-version: "22.23.4"

      - name: FleetLab Playground suite
        run: node --test "playground/fleetlab/test/*.test.mjs"

      - name: FleetLab City suite
        working-directory: apps/fleetlab-city
        run: node --test test/*.test.mjs

      - name: FleetLab traffic suite
        run: node --test "tools/fleetlab-traffic/test/*.test.mjs"
