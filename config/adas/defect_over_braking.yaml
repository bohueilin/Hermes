# SEEDED DEFECT - a controller that is meant to fail.
#
# Defect: treats almost any closing geometry as an emergency, so it brakes when nothing
# warrants it. Expected detection: adas.aeb.no_false_intervention, i.e. OVER_INTERVENTION.
# This is the defect a collision-only metric would reward.
functions:
  - fcw
  - aeb
aeb:
  # Preserve the deliberately tiny 0.012/0.024 m/s^2 staging boundaries against the measured
  # 20 m/s peak in evidence/calibration/metadrive-brake-curve-0.4.3.json.
  partial_authority_fraction: 0.0009243251343560853
  emergency_authority_fraction: 0.0018486502687121706
  minimum_ego_speed_mps: 0.0
