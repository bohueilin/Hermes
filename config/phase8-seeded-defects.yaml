# Seeded-evaluation suite: deliberately seeded policy or environment failures the
# evaluation MUST catch.
#
# This is the acceptance criterion for the evaluation itself. A gate that never fails is
# indistinguishable from a gate that cannot fail, so each entry names a seeded failure, the
# scenario that exposes it, the finding that must catch it, and the failure category the
# triage agent must propose.
#
# The thirteen policy defects use config/adas/baseline.yaml with one property changed. The
# observation-delay row instead keeps the baseline policy and seeds the environment path.
schema_version: "1.0"
label: deliberately_seeded_policy_or_environment_failures_for_evaluation_acceptance
defects:
  - defect_id: late_braking
    description: Brakes only once required deceleration crosses the calibrated onset margin.
    policy_config: config/adas/defect_late_braking.yaml
    scenario: scenarios/adas/aeb_lead_hard_brake.yaml
    expected_failing_finding: adas.aeb.brake_onset_margin
    expected_triage_category: INTERVENTION_TOO_LATE

  - defect_id: no_aeb
    description: Warns but never intervenes.
    policy_config: config/adas/defect_no_aeb.yaml
    scenario: scenarios/adas/aeb_lead_hard_brake.yaml
    expected_failing_finding: adas.aeb.threat_response
    expected_triage_category: MISSED_INTERVENTION

  - defect_id: over_braking
    description: Treats almost any closing geometry as an emergency.
    policy_config: config/adas/defect_over_braking.yaml
    scenario: scenarios/adas/adas_nominal_slow_closing.yaml
    expected_failing_finding: adas.aeb.no_false_intervention
    expected_triage_category: OVER_INTERVENTION

  # The same two defects again, on a cut-in rather than a lead brake. The controllers are
  # unchanged and so is the oracle; only the geometry differs. These entries exist to show
  # the evaluation is not tuned to one manoeuvre - a defect that is caught only in the
  # scenario it was discovered in has not really been characterised.
  - defect_id: no_aeb_cut_in
    description: Warns but never intervenes, when the threat arrives as a near-field cut-in.
    policy_config: config/adas/defect_no_aeb.yaml
    scenario: scenarios/adas/adas_cut_in_near.yaml
    expected_failing_finding: adas.aeb.threat_response
    expected_triage_category: MISSED_INTERVENTION

  - defect_id: over_braking_cut_in
    description: Treats a distant, slow merge ahead as an emergency.
    policy_config: config/adas/defect_over_braking.yaml
    scenario: scenarios/adas/adas_cut_in_far.yaml
    expected_failing_finding: adas.aeb.no_false_intervention
    expected_triage_category: OVER_INTERVENTION

  # The classic stationary-object pair adds the same evaluation diagonal with no manoeuvre.
  # The nominal defect is deliberately different from the threshold-only over-braking
  # config: it pattern-matches on any scripted actor instead of respecting in-path geometry.
  - defect_id: no_aeb_stationary
    description: Warns but never intervenes for an avoidable stopped in-lane actor.
    policy_config: config/adas/defect_no_aeb.yaml
    scenario: scenarios/adas/aeb_stationary_lead.yaml
    expected_failing_finding: adas.aeb.threat_response
    expected_triage_category: MISSED_INTERVENTION

  - defect_id: over_braking_stationary
    description: Brakes for a stopped adjacent-lane actor with no in-path front geometry.
    policy_config: config/adas/defect_actor_presence_braking.yaml
    scenario: scenarios/adas/non_in_path_stationary_object.yaml
    expected_failing_finding: adas.aeb.no_false_intervention
    expected_triage_category: OVER_INTERVENTION

  # The long-gap FCW threat carries the same complementary diagonal, now with warning-due
  # geometry materially ahead of controller PARTIAL staging.
  - defect_id: no_aeb_fcw_stationary
    description: Warns but never intervenes for the long-gap FCW stationary-lead threat.
    policy_config: config/adas/defect_no_aeb.yaml
    scenario: scenarios/adas/fcw_stationary_lead.yaml
    expected_failing_finding: adas.aeb.threat_response
    expected_triage_category: MISSED_INTERVENTION

  - defect_id: over_braking_fcw_stationary
    description: Brakes for a stopped adjacent-lane actor with no in-path front geometry.
    policy_config: config/adas/defect_actor_presence_braking.yaml
    scenario: scenarios/adas/non_in_path_stationary_object.yaml
    expected_failing_finding: adas.aeb.no_false_intervention
    expected_triage_category: OVER_INTERVENTION

  # A constant-speed moving-lead pair exercises the same complementary diagonal using
  # geometry alone. The nominal defect intentionally reacts to actor presence, not threat.
  - defect_id: no_aeb_steady
    description: Warns but never intervenes for a steady moving-lead closing threat.
    policy_config: config/adas/defect_no_aeb.yaml
    scenario: scenarios/adas/slow_lead_closing.yaml
    expected_failing_finding: adas.aeb.threat_response
    expected_triage_category: MISSED_INTERVENTION

  - defect_id: actor_presence_braking_steady_nominal
    description: Brakes for a steady moving lead even though the following geometry is nominal.
    policy_config: config/adas/defect_actor_presence_braking.yaml
    scenario: scenarios/adas/fcw_aeb_nominal_following.yaml
    expected_failing_finding: adas.aeb.no_false_intervention
    expected_triage_category: OVER_INTERVENTION

  - defect_id: actor_presence_braking_adjacent_pass
    description: Brakes for a moving adjacent-lane actor with no in-path front geometry.
    policy_config: config/adas/defect_actor_presence_braking.yaml
    scenario: scenarios/adas/adjacent_lane_pass.yaml
    expected_failing_finding: adas.aeb.no_false_intervention
    expected_triage_category: OVER_INTERVENTION

  # Measured at seed 7: 200/200 braking steps. Hard failures are progress.required at
  # 14.177567142144234% and the named ADAS no_false_intervention finding; the seeded
  # named finding and proposed/deterministic triage remain OVER_INTERVENTION.
  - defect_id: actor_presence_braking_decel_nominal
    description: Brakes for an in-lane decelerating lead even though the following geometry is nominal.
    policy_config: config/adas/defect_actor_presence_braking.yaml
    scenario: scenarios/adas/decelerating_but_safe_lead.yaml
    expected_failing_finding: adas.aeb.no_false_intervention
    expected_triage_category: OVER_INTERVENTION

  # Environment-path seed: the policy is the unchanged baseline. Verified metrics, fault
  # coverage, and the stored policy threshold prove the upstream stale-observation cause.
  - defect_id: stationary_observation_delay
    description: Delays a stopped in-lane actor observation until the baseline misses AEB.
    policy_config: config/adas/baseline.yaml
    scenario: scenarios/adas/aeb_stationary_lead_observation_delay.yaml
    expected_failing_finding: adas.aeb.threat_response
    expected_triage_category: STALE_OBSERVATION
