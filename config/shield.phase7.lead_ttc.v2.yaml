# Phase 7 candidate shield, version 2, for the declared lead-TTC engagement
# question at a 4.0 s threshold.
#
# Illustrative simulation-only thresholds. These are not real-vehicle limits.
#
# Why 4.0 s and not 2.0 s: 65 registered baseline discovery attempts across
# protocol versions 1-3 (see evaluation-plans/DISCOVERY_RESULTS.md) established
# that the metadrive-idm policy never lets the policy-input TTC fall below about
# 3.11 s in a lead-vehicle hard-brake encounter. A 2.0 s threshold is therefore
# structurally unreachable for this challenge and policy, and that negative
# result stands unchanged in the record. This configuration asks a different,
# explicitly stated question at a threshold above the measured floor.
#
# Every non-target trigger remains non-binding, and configuration alone does not
# prove that: the assessor also requires event evidence that no non-target reason
# fired through the treatment divergence.
schema_version: "1.0"
name: phase3_deterministic
version: "1.0"
label: illustrative_simulation_only_not_real_vehicle_limits
ttc_threshold_s: 4.0
speed_cap_mps: 50.0
max_observation_age_s: 1.0
boundary_margin_m: 0.25
actuation_delay_compensation_s: 0.0
emergency_stop_active: false
full_brake_command: 1.0
boundary_steering_command: 0.5
