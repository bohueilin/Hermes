# Phase 7 candidate shield, version 2, for the declared lead-TTC engagement
# question at a 4.0 s threshold.
#
# Illustrative simulation-only thresholds. These are not real-vehicle limits.
#
# Why 4.0 s and not 2.0 s: 65 registered baseline discovery attempts across
# protocol versions 1-3 (see evaluation-plans/DISCOVERY_RESULTS.md) observed a
# floor of about 3.11 s in a lead-vehicle hard-brake encounter with this policy at
# an 8.0 m/s ego target speed. That floor is MetaDrive IDMPolicy's 30 m detection
# horizon, not a headway-preserving controller, and it scales with target speed,
# which no registered attempt varied. The 2.0 s question is therefore unreachable
# within the registered family rather than unreachable in general.
#
# 4.0 s is the smallest round value above the observed floor that leaves in-band
# baseline events at every gap the v2/v3 ledgers recorded below it. It is
# illustrative, not a safety criterion.
#
# Every non-target trigger remains non-binding, and configuration alone does not
# prove that: the assessor also requires event evidence that no non-target reason
# fired through the treatment divergence.
schema_version: "1.0"
name: phase3_deterministic
version: "1.0"
label: illustrative_simulation_only_not_real_vehicle_limits
ttc_threshold_s: 4.0
speed_cap_mps: 50.0
max_observation_age_s: 1.0
boundary_margin_m: 0.25
actuation_delay_compensation_s: 0.0
emergency_stop_active: false
full_brake_command: 1.0
boundary_steering_command: 0.5
