[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-autonomy"
version = "0.1.0"
description = "Simulation-only autonomy scenario and safety-evidence lab"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6.0,<7",
    "rich>=13.7,<15",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]
workbench = [
    "streamlit>=1.37,<2",
]

[project.scripts]
hermes = "hermes.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "metadrive: requires a real local MetaDrive installation and simulator assets",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
# tools/phase7-authoring is a committed historical record of the scripts that produced
# the Phase 7A evidence, preserved verbatim for inspection. Linting it would mean
# editing it, which would destroy the thing it exists to be.
extend-exclude = ["tools/phase7-authoring"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
