# SIMULATION-ONLY ADAS scenario. Illustrative parameters; no standards or regulatory meaning.
#
# The flagship AEB threat: the ego is already travelling when a slower lead vehicle brakes
# hard ahead of it. The oracle labels the closing geometry as a threat, so the run must
# produce braking and avoid contact.
schema_version: "4.0"
name: adas_aeb_lead_hard_brake
version: "1.0"
description: Ego closes on a slower lead vehicle that applies a scheduled full-brake command.
adapter: metadrive
control:
  frequency_hz: 10
  horizon_steps: 300
  target_speed_mps: 8.0
initial_state:
  speed_mps: 20.0
  lateral_offset_m: 0.0
road:
  destination_distance_m: 240.0
  boundary_tolerance_m: 1.5
challenge:
  kind: lead_vehicle_hard_brake
  actor_control_mode: metadrive_dynamic_action
  behavior_realism_claim: false
  initial_gap_m: 10.0
  actor_speed_mps: 8.0
  trigger_step: 30
  brake_duration_steps: 40
  brake_command: -1.0
  resume_throttle_command: 0.2
tags:
  - aeb
  - fcw
  - longitudinal
  - threat
odd:
  road_type:
    - highway
  weather:
    - clear
  lighting:
    - daylight
  min_speed_mps: 0.0
  max_speed_mps: 30.0
adas:
  enabled:
    - fcw
    - aeb
  expected_fcw:
    kind: required
    before_ttc_s: 2.6
  expected_aeb:
    kind: required
