# SIMULATION-ONLY ADAS scenario. Illustrative parameters; no standards or regulatory meaning.
#
# PREDICTIONS from the authored primary tuple: deceleration starts at t_s = 1.0 s, lasts
# tau_T = 2.5 s / N = 25 intervals, and reaches the positive terminal speed at t = 3.5 s.
# Inputs should be DECELERATING at sequences 10-34, results at 9-33, with terminal STEADY
# results from sequence 34. If the donor nominal's approximately 6.1 s / 61-event
# DESTINATION_REACHED shape transfers, deceleration completes about 57% into the stored run.
# Predicted extrema over that finite run are approximately 19.4 m minimum gap, 0.71 m/s^2
# maximum required deceleration, and 3.9 s minimum TTC, with zero oracle threat or warning-due
# samples and zero braking.
#
# MEASURED on these values at seed 7: 61 events / 6.1 s, DESTINATION_REACHED, exact predicted
# phase windows, 61/61 input and result schedule matches, and 60/60 input-to-prior-result
# continuity transitions. The minimum result gap is 20.82934416472216 m, maximum oracle input
# required deceleration is 0.6015678307197855 m/s^2, and minimum result TTC is
# 4.354226883259174 s. There are zero oracle threat, warning-due, and positive-brake samples.
# The sequence-zero input gap is 39.99999952316284 m and the result-gap transient is
# 1.5991270542144775 m; result ego speed is 19.963645935058594 m/s, 0.03635406494140625 m/s
# below target. The in-lane front pair is PRESENT in all 61 input and result samples.
#
# The run terminates mid-approach at the map end while closure remains open, so these margins
# describe only the STORED run and are not an indefinite-following claim. The CONDITIONAL
# verdict reflects two soft NOT_AVAILABLE findings by design. expected_fcw none does not prove
# observed warning absence.
